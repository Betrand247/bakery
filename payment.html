    <div class="container">

        <div id="mobile-money-form" class="payment-form">
            <h2>Mobile Money Details</h2>
            <form id="momoForm" action="your-server-side-script.php" method="post">  <!-- REPLACE THIS -->
                <div class="form-group">
                    <label for="momoName">Name:</label>

                 <div class="form-group">
                    <label for="amount">Amount:</label>
                    <input type="number" id="amount" name="amount" placeholder="Enter Amount" required>
                </div>
             
            </form>
        </div>  <button class="button" onclick="window.location.href='confirmation.html'">Pay Now</button>

        <div id="credit-card-form" class="payment-form hidden">
            <h2>Credit Card Details</h2>
            <form id="cardForm" action="your-server-side-script.php" method="post"> <!-- REPLACE THIS -->
                <div class="form-group">

                </div>
                <div class="form-group">
                    <label for="expiryDate">Expiry Date:</label>

                </div>

    <script>
        const mobileMoneyButton = document.querySelector('[data-method="mobile-money"]');
        const creditCardButton = document.querySelector('[data-method="credit-card"]');
        const mobileMoneyForm = document.getElementById('mobile-money-form');
        const creditCardForm = document.getElementById('credit-card-form');

        mobileMoneyButton.addEventListener('click', () => {
            mobileMoneyButton.classList.add('active');
            creditCardButton.classList.remove('active');
            mobileMoneyForm.classList.remove('hidden');
            creditCardForm.classList.add('hidden');
        });

        creditCardButton.addEventListener('click', () => {
            creditCardButton.classList.add('active');
            mobileMoneyButton.classList.remove('active');
            creditCardForm.classList.remove('hidden');
            mobileMoneyForm.classList.add('hidden');
        });
    </script>
